
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-leo
  namespace: test-leo
  labels:
    app: test-leo
    app.kubernetes.io/name: test-leo
  annotations:
    # ALB Configuration - uses shared platform ALB
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: dev-platform
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:073841136902:certificate/f9d4eb84-a2df-45a3-9b70-b99ddfc76eaa
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
    # External DNS
    external-dns.alpha.kubernetes.io/hostname: test-leo.g2p.timedevops.click
spec:
  rules:
    - host: test-leo.g2p.timedevops.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-leo
                port:
                  name: http

